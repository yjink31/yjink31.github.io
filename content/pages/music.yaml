# =============================================================================
# The Music page: the orchestra film with its side text at the top, the films
# under it, and the photographs that close it.
#
# HOW TO EDIT
#   * A "#" starts a note for you. The site ignores everything after it.
#   * Keep the indentation exactly as it is. Each level is two spaces deeper.
#   * Keep the wording before each ":" unchanged. Change only what follows it.
#   * To empty a field, delete the text after the ":" and leave nothing there.
#   * A list item begins with "- ". Keep the keys inside every item.
#   * Save the file, then reload the page.
# =============================================================================

heading: Music Portfolio
introduction: Viola

# -----------------------------------------------------------------------------
# The orchestra film and the text beside it: the film takes the wide column and
# the heading and copy sit alongside it as the side text. Which side the film
# takes is chosen in content/site.yaml (feature_side).
#
# Leave a src empty until that file exists: the still stands in and the page says
# so honestly, instead of showing a player with nothing to play. Files live in
# public/media/music and are written here as /media/music/<file>.
# -----------------------------------------------------------------------------
feature:
  heading: Orchestra
  copy: Emory Youth Symphony Orchestra (EYSO) & GMEA All-State Orchestra
  # An optional line under the copy. Leave it empty to hide it.
  note:
  # The film beside the text above. It starts on its own, muted, once it is in view.
  video:
    src: /media/music/Orchestra1.mp4
    # The still shown before playback starts.
    poster: https://images.unsplash.com/photo-1507838153414-b4b713384a76?auto=format&fit=crop&w=1600&q=85
    # An optional line under the player. Leave it empty to hide it.
    caption:
    # true while this is demo footage rather than a performance; it repeats.
    demo: false
  # The short practice words under the note.
  topics:
    - Solo
    - Ensemble
    - Performance

# -----------------------------------------------------------------------------
# The films under the orchestra film, in order, each one the full width of the
# window and played right here on the page. They wait for a press, and each
# film's caption is the text shown below its player.
# -----------------------------------------------------------------------------
films:
  - title: Bach prelude
    src: /media/music/BachPrelude1.mp4
    # The still shown before playback starts.
    poster: https://images.unsplash.com/photo-1520523839897-bd0b52f945a0?auto=format&fit=crop&w=1600&q=85
    # The text below the player. Leave it empty to hide it.
    caption: J.S. Bach, Prelude.
    # true while this is demo footage rather than a performance; it repeats.
    demo: false
  - title: Solo repertoire
    src:
    poster: https://images.unsplash.com/photo-1460036521480-ff49c08c2781?auto=format&fit=crop&w=1600&q=85
    caption:
    demo: false

# -----------------------------------------------------------------------------
# The photographs that close the page: one strip the reader turns with the left
# and right arrows. Every picture sits on one circle, and each press rotates the
# circle one place, wrapping at both ends.
#
# Every entry needs its file, a description for a visitor who cannot see it, and
# the picture's real proportions in pixels, so upright and wide photographs are
# both shown whole rather than cropped to one shape.
# -----------------------------------------------------------------------------
photos:
  - image: /media/music/265.JPG
    alt: Photograph 1 from the music collection.
    width: 2448
    height: 3264
  - image: /media/music/IMG_5505.JPG
    alt: Photograph 2 from the music collection.
    width: 2816
    height: 2112
  - image: /media/music/IMG_7376.JPG
    alt: Photograph 3 from the music collection.
    width: 4000
    height: 1868
  - image: /media/music/IMG_7498.JPG
    alt: Photograph 4 from the music collection.
    width: 2703
    height: 2027
  - image: /media/music/IMG_8833.JPG
    alt: Photograph 5 from the music collection.
    width: 2448
    height: 2448
  - image: /media/music/20150303_152956.jpg
    alt: Photograph 6 from the music collection.
    width: 4128
    height: 2322
