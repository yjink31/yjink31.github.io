# =============================================================================
# The Art page: the front page of the site, at / and /art.
#
# It reads left to right: the portrait and greeting, then the resume panel, over
# the bento collection grid. The works themselves live in
# content/media/artworks.yaml.
#
# HOW TO EDIT
#   * A "#" starts a note for you. The site ignores everything after it.
#   * Keep the indentation exactly as it is. Each level is two spaces deeper.
#   * Keep the wording before each ":" unchanged. Change only what follows it.
#   * To empty a field, delete the text after the ":" and leave nothing there.
#   * A list item begins with "- ". Keep the keys inside every item.
#   * Save the file, then reload the page.
# =============================================================================

# -----------------------------------------------------------------------------
# The hero: the portrait and its greeting, with the resume panel beside them,
# above the collection. The greeting is the page's own heading, so there is no
# separate page heading.
# -----------------------------------------------------------------------------
hero: 
  portrait:
    # A file in public/media, or a full https:// address.
    image: /media/portrait.jpg
    alt: Reference portrait photograph, not Yujin Kim.
    # The greeting, which is the page's own heading.
    lead: Art Portfolio
    # The caption below the greeting.
    caption: Hello, I'm Yujin!
    # The real proportions of the image file, in pixels.
    width: 1280
    height: 1280
  # The resume PDF, previewed in the panel beside the portrait. A file in
  # public/media, or a full https:// address. Leave it empty and the panel
  # does not appear.
  resume_url: /media/resume.pdf

