  heading: Response of STF Influenced Lattice Structures Under Complex Loading
  copy: Researched the application of Shear Thickening Fluid (STF) to 3D-printed Thermoplastic Polyurethane (TPU) lattice structures to evaluate their mechanical performance and energy absorption. Collected shear and compression data on the Universal Testing Machine to analyze the greatest resistance to deformation ratio
