# =============================================================================
# The Research page: the three required sections, in order.
#
# The paper panels each section points at live in content/media/papers.yaml, and
# each panel draws its paper's own pages, stacked and scrollable, like the resume.
#
# IMAGE DECKS
# A block that shows one picture uses `image:` plus `alt:`.
# A block that should let the reader cycle through several pictures uses `images:`
# instead, a list of `image:`/`alt:` entries. Pressing the picture advances to the
# next one and wraps around, and hovering it shows a cursor hint. A list with a
# single entry is simply a single picture. Use one form or the other, never both.
# A picture that declares `width:` and `height:` is shown whole, so a set of
# upright and wide photographs should carry the pair rather than be cut to one
# shape.
# =============================================================================

