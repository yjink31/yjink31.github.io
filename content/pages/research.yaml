  note:
  # Two images: the first is the wider one, the second the taller one.
  images:
    - image: https://images.unsplash.com/photo-1579154204601-01588f351e67?auto=format&fit=crop&w=900&q=85
      alt: Stock image of a microscope in a laboratory.
    - image: https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&fit=crop&w=900&q=85
      alt: Stock photograph of notes on an open desk.
  # Which paper panel belongs to this section. Matches a key in papers.
  paper: ghp
