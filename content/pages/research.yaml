  projects:
    - title: Carbon Neutral Building
      copy: To find the optimal school location for solar panels, I designed a stable prototype that eliminated manual human errors and allowed us to collect accurate voltage and current data. Using this data, I identified the area with maximum sunlight and designed the physical building on AutoCAD, applying precise dimensioning skills. Finally, I modeled the infrastructure on Onshape, intentionally optimizing natural light with large windows for the plant research lab while shading the aquaponics lab to prevent algae growth.
