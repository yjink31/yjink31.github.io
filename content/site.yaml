# =============================================================================
# Yujin Kim portfolio: the site's spine.
#
# WHERE EVERYTHING LIVES
#   content/site.yaml       this file: identity, appearance, navigation, layout,
#                           and messages.
#   content/theme.yaml      every colour the site uses, light and dark, including
#                           the Me hero's own palette.
#   content/media/*.yaml    the media collections, one file each: artworks,
#                           recordings, and papers.
#   content/pages/*.yaml    the copy for each page: art (the front page), music,
#                           research, and not-found. One file per page.
#
# HOW TO EDIT
#   * A "#" starts a note for you. The site ignores everything after it.
#   * Keep the indentation exactly as it is. Each level is two spaces deeper.
#   * Keep the wording before each ":" unchanged. Change only what follows it.
#   * To empty a field, delete the text after the ":" and leave nothing there.
#   * A list item begins with "- ". Keep the keys inside every item.
#   * Save the file, then reload the page.
#
# WHAT IS NOT HERE
#   The interface's own labels and markers: the action labels (Inspect work,
#   Previous work, Next work, Open paper, Play, Pause, Mute, Retry, Back to Art),
#   the theme control,
#   and the one-line credit markers that follow an artist's name. The design
#   contract fixes one name for each action, so they stay in the code while these
#   files hold the content those controls act on.
#
#   The resume PDF is page copy, so its link lives with the Art page in
#   content/pages/art.yaml rather than here.
# =============================================================================

# -----------------------------------------------------------------------------
# Identity
# -----------------------------------------------------------------------------
site:
  # Shown in the header, the footer, and the browser tab.
  name: Yujin Kim
  # Used in the browser tab and in search results.
  tagline: A portfolio preview spanning art, music, and research.

# -----------------------------------------------------------------------------
# Appearance
#
# The typographic character of the whole site. This is the single switch between
# the two full looks: change the value below, save, and reload.
# -----------------------------------------------------------------------------
appearance:
  # Which look every page wears.
  # classic | times
  #   classic: the geometric sans the site was designed with. The default.
  #   times:   a classic serif look — Times and its relatives, without the
  #            tight display tracking that only suits the sans.
  look: classic

# -----------------------------------------------------------------------------
# The three destinations, in reading order. The labels and paths are required by
# the structure brief, so keep them as they are.
# -----------------------------------------------------------------------------
navigation:
  - label: Art
    href: /
  - label: Music
    href: /music
  - label: Research
    href: /research

# -----------------------------------------------------------------------------
# Layout
#
# Pick one of the listed values on each line. Every combination below was
# designed to hold together; changing a value never breaks the page.
# -----------------------------------------------------------------------------
layout:
  # ---------------------------------------------------------------------------
  # Music
  # ---------------------------------------------------------------------------
  music:
    # The three practice words under the experience text.
    show_topics: true
  # ---------------------------------------------------------------------------
  # Artwork pages
  # ---------------------------------------------------------------------------
  detail:
    # Which side of an artwork page its facts column takes.
    # left | right
    copy_side: right

# -----------------------------------------------------------------------------
# Sentences shown while something has not been supplied yet.
# -----------------------------------------------------------------------------
messages:
  paper_missing: The paper and publication details have not been supplied.
  recording_missing_heading: Recording not supplied yet.
  recording_missing_copy: This space is ready for Yujin’s video, a poster, and performance notes.
