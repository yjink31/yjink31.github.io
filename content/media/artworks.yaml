# =============================================================================
# The collection: every work the front page's bento grid draws from.
#
# The order here is the order the grid fills, left to right, top to bottom.
# Copy one block to add a work, and delete a block to remove one.
#
# These twelve works are PLACEHOLDERS: each `image` points at a numbered drawing
# in public/media/placeholders, not at a real piece. Replace each block with a
# real work and its file when the material is supplied. The titles, artists, and
# years here are neutral labels, not claims about anyone's work.
#
# HOW TO EDIT
#   * A "#" starts a note for you. The site ignores everything after it.
#   * Keep the indentation exactly as it is. Each level is two spaces deeper.
#   * Keep the wording before each ":" unchanged. Change only what follows it.
#   * A list item begins with "- ". Keep the keys inside every item.
#   * Every work needs its own slug: the pages point at works by that name.
#   * Save the file, then reload the page.
# =============================================================================

artworks:
  - slug: work-08
    title: Should I Drop Out?
    artist: 15”x13”x9”
    year: 2025
    material: Mixed Media (Paper Clay, Cardboard, Wood)
    description: Inspired by personal experiences of feeling overwhelmed in class, this piece captures the weight of academic pressure. Clay’s malleable, slumping forms show vulnerability, while the megaphone visualizes one-way communication of the teacher shifting yellow-to-red with frustration.
    reference: false
    image: /media/placeholders/Should I Drop Out.jpg
    alt: Placeholder drawing numbered 08, a landscape panel.
    width: 2476
    height: 1648
    crop: '50% 50%'
    size: wide

  - slug: work-02
    title: ESC
    artist: 20”x17½”
    year: 2026
    material: Acrylic Painting on Canvas
    description: Through exaggerated spatial perspective, this composition explores the disjunction between human physical labor and digital abstraction. The contrast of the warm figure to the cold, oversized keys highlight how human efforts are overlooked in a digitalized world.
    reference: false
    image: /media/placeholders/ESC.PNG
    alt: Placeholder drawing numbered 02, a wide panel.
    width: 1622
    height: 1280
    crop: '50% 50%'
    size: small

  - slug: work-06
    title: Inverse Lives
    artist: 25”x19”
    year: 2025
    material: Watercolor & Colored Pencil on Watercolor Paper
    description: Observing a fish tank reveals a world of its own. Reversing the roles of pets and humans, this piece explores themes of control and manipulation, using the depth of physical layers to translate this psychological barrier.
    reference: false
    image: /media/placeholders/Inverse Lives.jpg
    alt: Placeholder drawing numbered 06, a wide panel.
    width: 2536
    height: 1970
    crop: '50% 50%'
    size: small
    
  - slug: work-04
    title: Good Enough to Eat
    artist: 22”x28”
    year: 2025
    material: Oil Painting on Canvas
    description: This oil painting uses thick textures to integrate a dolled up self-portrait with the anatomy of a cake. The contrast between the two textures captures the strain sugar-coating my identity to meet others' expectations.
    reference: false
    image: /media/placeholders/Good Enough to Eat.jpeg
    alt: Placeholder drawing numbered 04, a landscape panel.
    width: 1700
    height: 2131
    crop: '50% 50%'
    size: wide

  - slug: work-07
    title: Waterbuttle
    artist: 20”x24”
    year: 2025
    material: Acrylic Painting on Canvas
    description: This piece explores perspective through direct observation. Through the awkward angle and placement of the bottle, I portrayed a partial loss of human control, depicting how waste has become permanently embedded within our environment.
    reference: false
    image: /media/placeholders/Waterbuttle.jpg
    alt: Placeholder drawing numbered 07, a square panel.
