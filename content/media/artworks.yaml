    year: 2026
    material: Charcoal on Paper
    description: This study explores proportional accuracy with a compressed, guarded figure. The slightly offset positioning of the subject and shriveled pose, suggests hesitation while high contrast of the anatomical contours capture the values of the clothing wrinkles. 
