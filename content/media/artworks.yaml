  - slug: work-05
    title: Not My Bathroom
    artist: 16”x20”
    year: 2026
    material: Oil Painting on Canvas
    description: Moving into a new house made me feel like a stranger in my own supposed home. Through the use of cool, muted colors and contrasting shadows, I reinterpreted an otherwise normal bathroom into an unwelcoming, cold space.
    reference: false
    image: /media/placeholders/Not My Bathroom.jpg
    alt: Placeholder drawing numbered 05, a tall panel.
    width: 2096
    height: 2630
